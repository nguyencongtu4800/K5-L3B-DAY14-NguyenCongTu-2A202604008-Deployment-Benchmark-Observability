# ============================================================
# Render Blueprint (tiêu chí 12) — phương án thay cho railway.toml
# Render đọc Blueprint ở gốc repo; khi dùng, copy file này ra gốc repo
# (rootDir trỏ vào 06-lab-complete).
# Secret không ghi giá trị: AGENT_API_KEY dùng generateValue.
# ============================================================
services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"

  - type: keyvalue
    name: day14-redis
    plan: free
    ipAllowList: []          # chỉ cho phép kết nối nội bộ từ các service của Render
