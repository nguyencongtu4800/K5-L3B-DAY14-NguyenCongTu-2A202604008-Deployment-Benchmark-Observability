# ============================================================
# Railway (tiêu chí 12)
#   cd 06-lab-complete && railway up
# Biến môi trường đặt trên Railway (không ghi ở đây):
#   AGENT_API_KEY, REDIS_URL (= ${{Redis.REDIS_URL}}), ENVIRONMENT=production,
#   RATE_LIMIT_PER_MINUTE, DAILY_BUDGET_USD
# PORT do Railway tự cấp — CMD trong Dockerfile đọc ${PORT:-8000}.
# ============================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
